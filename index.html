<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulasi SKD CPNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12304f;--navy-2:#0b2038;--ink:#1b2430;--muted:#5b6776;--line:#d5dbe3;--line-2:#e6eaf0;
  --canvas:#edf0f4;--paper:#fff;--blue:#1f6fd1;--blue-soft:#e7f0fc;--green:#2c9a58;--green-soft:#e2f4ea;
  --amber:#f2a93b;--amber-soft:#fcf0da;--amber-ink:#8a5a07;--red:#c73a3a;--red-soft:#fbe7e7;
  --r:6px;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--canvas);line-height:1.5;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;font-weight:600}
h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}
p{margin:0 0 10px}
.mut{color:var(--muted)}.sm{font-size:13px}.nowrap{white-space:nowrap}
.hide{display:none!important}

/* ---- topbar ---- */
#top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
#top .in{max-width:1160px;margin:auto;display:flex;align-items:center;gap:20px;padding:0 16px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;color:#fff;text-decoration:none}
.brand svg{width:28px;height:28px;flex:none}
.nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.nav button{background:none;border:0;color:#c5d3e4;padding:17px 12px 15px;border-bottom:3px solid transparent;font-weight:500}
.nav button:hover{color:#fff}
.nav button.on{color:#fff;border-bottom-color:var(--amber)}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:#c5d3e4}
.who b{color:#fff;font-weight:500}
.linkbtn{background:none;border:0;color:#c5d3e4;text-decoration:underline;padding:4px;font-size:13px}
.linkbtn:hover{color:#fff}
main{max-width:1160px;margin:0 auto;padding:24px 16px 56px}
.foot{max-width:1160px;margin:0 auto;padding:0 16px 28px;color:var(--muted);font-size:12px}

/* ---- komponen umum ---- */
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h p{margin:4px 0 0;color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.panel>h2{margin-bottom:12px}
.btn{background:var(--navy);color:#fff;border:1px solid var(--navy);padding:9px 16px;border-radius:var(--r);font-weight:500;line-height:1.2}
.btn:hover{background:var(--navy-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--blue);border-color:var(--blue)}.btn.pri:hover{background:#185ab0}
.btn.sec{background:#fff;color:var(--navy);border-color:var(--line)}.btn.sec:hover{border-color:var(--navy);background:#fff}
.btn.red{background:var(--red);border-color:var(--red)}.btn.red:hover{background:#a82f2f}
.btn.xs{padding:5px 10px;font-size:13px}
.btn.wide{width:100%}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #bcc5d0;border-radius:var(--r);background:#fff}
input[type=checkbox],input[type=radio]{width:auto}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:150px}
.row>.fit{flex:none;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:13px;background:#f6f8fa;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--blue-soft);color:#154f98;white-space:nowrap}
.tag.ok{background:var(--green-soft);color:#1b6b3b}.tag.bad{background:var(--red-soft);color:#962b2b}
.tag.warn{background:var(--amber-soft);color:var(--amber-ink)}.tag.gray{background:#eceff3;color:#4a5564}
.notice{border:1px solid var(--amber);background:var(--amber-soft);color:#5d3e05;padding:10px 14px;border-radius:var(--r);margin-bottom:16px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--muted)}
.spin{text-align:center;padding:60px 0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy-2);color:#fff;padding:10px 16px;border-radius:var(--r);z-index:99;max-width:92%;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--red)}
dialog{border:0;border-radius:8px;padding:22px;max-width:680px;width:94%;box-shadow:0 20px 60px rgba(8,20,36,.35);color:var(--ink)}
dialog::backdrop{background:rgba(8,20,36,.55)}
dialog h2{margin-bottom:6px}
.dlg-act{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* ---- ringkasan angka ---- */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.facts>div{padding:14px 18px;border-right:1px solid var(--line-2)}
.facts>div:last-child{border-right:0}
.facts .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.facts .l{font-size:13px;color:var(--muted)}

/* ---- daftar paket ---- */
.paket{display:grid;grid-template-columns:76px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line-2)}
.paket:last-child{border-bottom:0}
.paket .no{font-size:13px;color:var(--muted);line-height:1.2}
.paket .no b{display:block;font-size:30px;color:var(--navy);font-weight:600;font-variant-numeric:tabular-nums}
.paket .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:2px}
.paket .st{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.paket.run{background:linear-gradient(90deg,var(--amber-soft),transparent 70%);margin:0 -20px;padding-left:20px;padding-right:20px}

/* ---- auth ---- */
body.auth #top{display:none}
body.auth main{max-width:none;padding:0}
body.auth .foot{display:none}
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:minmax(320px,5fr) 6fr}
.auth-side{background:var(--navy);color:#dbe6f3;padding:48px 44px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.auth-side svg{width:64px;height:64px}
.auth-side h1{color:#fff;font-size:34px;line-height:1.15;margin:20px 0 12px;font-weight:600}
.auth-side p{max-width:38ch;color:#b9c9dc}
.auth-side ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.auth-side li{padding-left:16px;border-left:3px solid var(--amber);font-size:14px;color:#dbe6f3}
.auth-main{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.auth-card{width:100%;max-width:380px}
.auth-card h2{font-size:22px;margin-bottom:4px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{background:none;border:0;padding:10px 16px 9px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
@media(max-width:820px){.auth-wrap{grid-template-columns:1fr}.auth-side{padding:28px 22px}.auth-side h1{font-size:26px}.auth-side ul{display:none}}

/* ---- layar ujian ---- */
body.exam #top,body.exam .foot{display:none}
body.exam main{max-width:none;padding:0}
.ex-head{background:var(--navy);color:#fff;position:sticky;top:0;z-index:10}
.ex-head .in{max-width:1220px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.ex-head svg{width:34px;height:34px;flex:none}
.ex-title{flex:1;min-width:0}
.ex-title b{display:block;font-size:16px;font-weight:600}
.ex-title span{font-size:13px;color:#b9c9dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ex-save{font-size:12px;color:#9fb4cc;white-space:nowrap}
.plate{border:2px solid #fff;border-radius:var(--r);padding:3px 14px 4px;text-align:center;background:var(--navy-2);min-width:128px}
.plate small{display:block;font-size:11px;color:#b9c9dc;line-height:1.1;margin-top:2px}
.plate .t{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:.04em;line-height:1.2}
.plate.warn{border-color:var(--amber)}.plate.warn .t{color:var(--amber)}
.plate.crit{border-color:#ff6b6b;animation:pulse 1s infinite}.plate.crit .t{color:#ff8c8c}
@keyframes pulse{50%{background:#5a1c1c}}
@media(prefers-reduced-motion:reduce){.plate.crit{animation:none}}
.ex-main{max-width:1220px;margin:18px auto 40px;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.qpanel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:#f6f8fa;border-radius:var(--r) var(--r) 0 0;flex-wrap:wrap}
.qhead .qn{font-weight:600;font-size:16px}
.fsz{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted)}
.fsz button{border:1px solid var(--line);background:#fff;border-radius:4px;width:30px;height:28px;font-weight:600}
.fsz button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.qbody{padding:20px 22px 8px;font-family:var(--serif);font-size:18px;line-height:1.65}
.qpanel.fs0 .qbody{font-size:16px}.qpanel.fs2 .qbody{font-size:21px}
.qtext{margin:0 0 18px;max-width:72ch}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:11px 14px;margin:0 0 9px;font-family:inherit;font-size:inherit;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--blue);background:#f7fafe}
.opt .ltr{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid #9aa7b6;display:grid;place-items:center;font-family:var(--sans);font-size:14px;font-weight:600;color:#44505f;margin-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .ltr{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.right{border-color:var(--green);background:var(--green-soft)}.opt.right .ltr{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}.opt.wrong .ltr{background:var(--red);border-color:var(--red);color:#fff}
.opt:disabled{cursor:default}
.opt .sk{margin-left:auto;flex:none;font-family:var(--sans);font-size:12px;font-weight:600;background:#eceff3;color:#44505f;border-radius:99px;padding:1px 9px}
.qfoot{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px 18px;border-top:1px solid var(--line);margin-top:10px;align-items:center}
.qfoot .sp{flex:1}
.ragu{display:flex;align-items:center;gap:8px;border:1.5px solid var(--amber);background:#fff;color:var(--amber-ink);border-radius:var(--r);padding:8px 14px;font-weight:500}
.ragu.on{background:var(--amber);color:#3d2802}
.ragu i{width:16px;height:16px;border:2px solid currentColor;border-radius:3px;display:grid;place-items:center;font-style:normal;font-size:12px;line-height:1}
.clearans{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px}
.fb{margin:2px 0 14px;padding:12px 14px;border-left:4px solid var(--blue);background:#f3f7fc;font-family:var(--sans);font-size:14px;line-height:1.55}
.fb.ok{border-left-color:var(--green);background:var(--green-soft)}.fb.no{border-left-color:var(--red);background:var(--red-soft)}
.side{position:sticky;top:84px}
.side .panel{padding:16px}
.side h3{margin-bottom:10px}
.gh{font-size:13px;font-weight:500;color:var(--muted);margin:12px 0 6px}
.gh:first-of-type{margin-top:0}
.gnum{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gnum button{height:36px;border-radius:4px;border:1.5px solid #b7c0cc;background:#fff;font-weight:500;font-variant-numeric:tabular-nums;padding:0}
.gnum button.ans{background:var(--green);border-color:var(--green);color:#fff}
.gnum button.rg{background:var(--amber);border-color:var(--amber);color:#3d2802}
.gnum button.cur{outline:3px solid var(--navy);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:12px 0 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid #b7c0cc;vertical-align:-1px;margin-right:5px}
.legend i.a{background:var(--green);border-color:var(--green)}.legend i.r{background:var(--amber);border-color:var(--amber)}
.sumline{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.mobgrid{display:none}
@media(max-width:940px){
  .ex-main{grid-template-columns:1fr}.side{display:none;position:static}
  .mobgrid{display:inline-flex}
  .ex-save{display:none}
  .plate{min-width:0;padding:2px 10px}.plate .t{font-size:19px}
  .qbody{padding:16px 14px 4px}.qhead,.qfoot{padding-left:14px;padding-right:14px}
}
.ldg{position:fixed;inset:0;background:rgba(237,240,244,.88);display:grid;place-items:center;z-index:50;color:var(--navy);font-weight:500}

/* ---- hasil ---- */
.verdict{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-left:6px solid var(--muted);background:#fff;border-radius:var(--r);padding:18px 22px;margin-bottom:16px}
.verdict.ok{border-left-color:var(--green)}.verdict.bad{border-left-color:var(--red)}
.verdict .big{font-size:42px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.sc3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:16px}
.sc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.sc .n{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.sc .n small{font-size:14px;color:var(--muted);font-weight:400}
.bar{position:relative;height:10px;background:#e8ecf1;border-radius:99px;margin:10px 0 6px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--blue)}
.bar>i.ok{background:var(--green)}.bar>i.bad{background:var(--red)}
.bar>u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-size:13px}
.filters button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.rv{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:8px}
.rv>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:center}
.rv>summary::-webkit-details-marker{display:none}
.rv .mk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.rv .mk.ok{background:var(--green)}.rv .mk.no{background:var(--red)}.rv .mk.kosong{background:#8b96a5}.rv .mk.mid{background:var(--amber);color:#3d2802}
.rv .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv .bd{padding:4px 16px 16px;font-family:var(--serif);font-size:16.5px;line-height:1.6}
.rv .opt{font-size:16px;padding:8px 12px;cursor:default}
.rv .opt:hover{border-color:var(--line);background:#fff}
.rv .opt.right:hover{background:var(--green-soft);border-color:var(--green)}.rv .opt.wrong:hover{background:var(--red-soft);border-color:var(--red)}
.rv .opt.sel:hover{background:var(--blue-soft);border-color:var(--blue)}

/* ---- ranking ---- */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.pod{background:#fff;border:1px solid var(--line);border-top:5px solid #aab4c1;border-radius:var(--r);padding:14px 16px}
.pod.p1{border-top-color:var(--amber)}.pod.p2{border-top-color:#8fa0b5}.pod.p3{border-top-color:#b98355}
.pod .rk{font-size:13px;color:var(--muted)}
.pod .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .pt{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
tr.me td{background:var(--amber-soft)}
@media(max-width:640px){.podium{grid-template-columns:1fr}.paket{grid-template-columns:56px 1fr}.paket .st{grid-column:1/-1;justify-content:flex-start}}

.kv{display:grid;grid-template-columns:180px 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.kv>div{padding:9px 14px;border-bottom:1px solid var(--line-2)}
.kv>div:nth-child(odd){background:#f6f8fa;color:var(--muted)}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}
.optrow{display:flex;gap:8px;align-items:flex-end}
.optrow .ltr{flex:none;width:26px;height:38px;display:grid;place-items:center;font-weight:600;color:var(--muted)}
.optrow .t{flex:1}.optrow .s{flex:none;width:84px}.optrow .k{flex:none;width:60px;text-align:center;padding-bottom:9px}
</style>
</head>
<body>
<header id="top"><div class="in" id="topin"></div></header>
<main id="app"></main>
<div class="foot" id="foot">Simulasi untuk latihan. Soal dan penilaian tidak mewakili seleksi resmi.</div>
<dialog id="dlg"></dialog>
<noscript><p style="padding:20px">Aplikasi ini membutuhkan JavaScript.</p></noscript>

<script>
/* ========= KONFIGURASI =========
   Isi URL Web App Google Apps Script (berakhiran /exec) di sini, atau biarkan kosong
   lalu tempel lewat halaman Pengaturan Awal saat pertama dibuka. */
const API_URL_DEFAULT = "";

/* ========= UTIL ========= */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lines = (s) => esc(s).replace(/\n/g, '<br>');
const safeGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const safeDel = (k) => { try { localStorage.removeItem(k); } catch (e) {} };
let API = safeGet('API_URL') || API_URL_DEFAULT;
let S = { token: safeGet('token') || '', user: null, view: '' };
try { S.user = JSON.parse(safeGet('user') || 'null'); } catch (e) {}
let E = null;          // sesi ujian aktif
let clock = null;      // interval timer

const EMBLEM = `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4 56 13v18c0 15-10 24-24 29C18 55 8 46 8 31V13z" fill="#0b2038" stroke="#f2a93b" stroke-width="3"/><path d="m32 19 4.2 8.6 9.4 1.3-6.8 6.6 1.6 9.4L32 40.5l-8.4 4.4 1.6-9.4-6.8-6.6 9.4-1.3z" fill="#f2a93b"/></svg>`;

async function api(action, data) {
  let r;
  try {
    r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, token: S.token }, data || {})) });
  } catch (e) { throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet Anda.'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Server memberi jawaban yang tidak dikenali. Periksa URL Web App dan pengaturan deploy ("Anyone").'); }
  if (!j.ok) {
    if (j.error === 'AUTH') { if (!E) { logout(true); } throw new Error('Sesi login berakhir. Silakan masuk lagi.'); }
    throw new Error(j.error);
  }
  return j.data;
}

function stopClock() { if (clock) { clearInterval(clock); clock = null; } if (E && E.t) clearTimeout(E.t); }
function enterExam(p) {
  stopClock(); dlgClose();
  let jawab = Object.assign({}, p.jawab || {}), ragu = Object.assign({}, p.ragu || {});
  if (p.mode === 'tryout') {
    try { const loc = JSON.parse(safeGet('cat_' + p.sesi) || 'null'); if (loc) { jawab = Object.assign({}, jawab, loc.jawab || {}); ragu = Object.assign({}, ragu, loc.ragu || {}); } } catch (e) {}
  }
  E = { sesi: p.sesi, mode: p.mode, paket: p.paket, kategori: p.kategori, soal: p.soal, jawab, ragu, cek: {}, i: 0, fs: Number(safeGet('fs') || 1),
        endAt: p.durasi ? Date.now() + p.sisa * 1000 : 0, ver: 0, savedVer: 0, saving: false, t: null, busy: false, warned: {}, closing: false };
  const first = E.soal.findIndex((s) => !E.jawab[s.id]);
  E.i = first > 0 && Object.keys(E.jawab).length ? first : 0;
  document.body.classList.add('exam'); window.scrollTo(0, 0);
  drawExam();
  if (E.endAt) { clock = setInterval(tick, 250); tick(); }
}
function tick() {
  if (!E || !E.endAt) return;
  const left = Math.max(0, Math.ceil((E.endAt - Date.now()) / 1000));
  const el = $('#tm');
  if (el) { el.textContent = hms(left); const pl = $('#plate'); pl.classList.toggle('warn', left <= 600 && left > 300); pl.classList.toggle('crit', left <= 300); }
  [600, 300, 60].forEach((m) => { if (left <= m && left > m - 5 && !E.warned[m]) { E.warned[m] = 1; toast('Sisa waktu ' + (m / 60) + ' menit', true); } });
  if (left <= 0 && !E.closing) { E.closing = true; toast('Waktu habis. Jawaban dikumpulkan otomatis.'); finishExam(true); }
}
function counts() {
  let a = 0, r = 0;
  E.soal.forEach((s) => { if (E.jawab[s.id]) a++; if (E.ragu[s.id]) r++; });
  return { a, r, k: E.soal.length - a };
}
function gridHtml() {
  let out = '', prev = '';
  E.soal.forEach((s, n) => {
    if (s.kategori !== prev) {
      if (prev) out += '</div>';
      const idx = E.soal.map((x, k) => (x.kategori === s.kategori ? k + 1 : 0)).filter(Boolean);
      out += `<div class="gh">${s.kategori} (soal ${idx[0]} sampai ${idx[idx.length - 1]})</div><div class="gnum">`; prev = s.kategori;
    }
    const c = (E.ragu[s.id] ? 'rg' : E.jawab[s.id] ? 'ans' : '') + (n === E.i ? ' cur' : '');
    out += `<button class="${c}" onclick="jump(${n})" aria-label="Soal ${n + 1}${E.jawab[s.id] ? ', terjawab' : ''}${E.ragu[s.id] ? ', ragu-ragu' : ''}">${n + 1}</button>`;
  });
  return out + '</div>';
}

function drawExam() {
  const s = E.soal[E.i], tryout = E.mode === 'tryout', ck = E.cek[s.id], pil = E.jawab[s.id];
  const isTkp = s.kategori === 'TKP';
  const opts = Object.keys(s.opsi).map((k) => {
    let cls = 'opt', badge = '';
    if (ck) {
      if (k === ck.kunci) cls += ' right'; else if (k === pil && !isTkp) cls += ' wrong'; else if (k === pil) cls += ' sel';
      if (isTkp && ck.skorOpsi) badge = `<span class="sk">skor ${ck.skorOpsi[k]}</span>`;
    } else if (k === pil) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${k}')" ${ck ? 'disabled' : ''} aria-pressed="${k === pil}"><span class="ltr">${k}</span><span>${lines(s.opsi[k])}</span>${badge}</button>`;
  }).join('');
  const last = E.i === E.soal.length - 1;
  const fb = ck ? `<div class="fb ${isTkp ? '' : ck.skor === 5 ? 'ok' : 'no'}"><b>${isTkp ? 'Skor pilihan Anda: ' + ck.skor + ' dari 5. Jawaban paling tepat: ' + ck.kunci + '.' : ck.skor === 5 ? 'Jawaban Anda benar.' : 'Jawaban Anda salah. Kunci: ' + ck.kunci + '.'}</b>${ck.pembahasan ? '<br>' + lines(ck.pembahasan) : ''}</div>` : '';
  const c = counts();
  $('#app').innerHTML = `<div class="ex-head"><div class="in">${EMBLEM}
    <div class="ex-title"><b>${tryout ? 'Ujian SKD CPNS, paket ' + E.paket : 'Latihan ' + esc(E.kategori)}</b><span>${esc(S.user.nama)}</span></div>

function refreshSide() { const el = $('#sidep'); if (el) el.innerHTML = sidePanel(); const g = $('#gdlg'); if (g && g.isConnected) g.innerHTML = sidePanel(); const mb = document.querySelector('.mobgrid'); if (mb) mb.textContent = 'Daftar soal ' + counts().a + '/' + E.soal.length; }
window.openGrid = () => { dlg(`<div id="gdlg">${sidePanel()}</div><div class="dlg-act"><button class="btn sec" onclick="dlgClose()">Tutup</button></div>`); };
window.jump = (n) => { if (!E || n < 0 || n >= E.soal.length) return; E.i = n; dlgClose(); drawExam(); window.scrollTo(0, 0); };
window.setFs = (n) => { E.fs = n; safeSet('fs', String(n)); drawExam(); };
window.toggleRagu = () => { const id = E.soal[E.i].id; if (E.ragu[id]) delete E.ragu[id]; else E.ragu[id] = 1; changed(); drawExam(); };
window.clearAns = () => { const id = E.soal[E.i].id; delete E.jawab[id]; changed(); drawExam(); };
window.pick = run(async (k) => {
  const s = E.soal[E.i];
  if (E.mode === 'latihan') {
    if (E.cek[s.id] || E.busy) return;
    E.busy = true;
    try { E.jawab[s.id] = k; E.cek[s.id] = await api('cek', { id: s.id, jawaban: k }); }
    catch (e) { delete E.jawab[s.id]; throw e; }
    finally { E.busy = false; }
    drawExam();
  } else {
    E.jawab[s.id] = k; changed(); drawExam();
  }
});
function changed() {
  if (E.mode !== 'tryout') return;
  E.ver++; safeSet('cat_' + E.sesi, JSON.stringify({ jawab: E.jawab, ragu: E.ragu }));
  setSave('Menyimpan…');
  clearTimeout(E.t); E.t = setTimeout(doSave, 1200);
}
function setSave(t) { const el = $('#svst'); if (el) el.textContent = t; }
async function doSave() {
  if (!E || E.mode !== 'tryout' || E.closing) return;
  if (E.saving) { E.t = setTimeout(doSave, 800); return; }
  E.saving = true; const ver = E.ver, sesi = E.sesi;
  try {
    await api('simpan', { sesi, jawab: E.jawab, ragu: E.ragu });
    if (E && E.sesi === sesi) { E.savedVer = ver; setSave(E.ver === ver ? 'Jawaban tersimpan' : 'Menyimpan…'); }
  } catch (e) { if (E) { setSave('Belum tersimpan, mencoba lagi…'); E.t = setTimeout(doSave, 4000); } }
  finally { if (E) { E.saving = false; if (E.ver !== E.savedVer && !E.t) E.t = setTimeout(doSave, 500); } }
}
document.addEventListener('keydown', (e) => {
  if (!E || e.ctrlKey || e.metaKey || e.altKey || $('#dlg').open) return;
  if (/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) return;
  const k = e.key.toUpperCase();
  if ('ABCDE'.includes(k) && k.length === 1 && E.soal[E.i].opsi[k]) { window.pick(k); }
  else if (e.key === 'ArrowRight') window.jump(E.i + 1);
  else if (e.key === 'ArrowLeft') window.jump(E.i - 1);
  else if (k === 'R' && E.mode === 'tryout') window.toggleRagu();
});
window.addEventListener('beforeunload', (e) => { if (E && E.mode === 'tryout') { e.preventDefault(); e.returnValue = ''; } });

window.finishExam = run(async (auto) => {

let RV = { d: null, f: 'semua' };
function statusOf(s) { if (!s.jawab) return 'kosong'; return s.skor === 5 ? 'benar' : 'salah'; }
function showResult(d, fromHistory) {
  RV = { d, f: 'semua' };
  document.body.classList.remove('exam'); drawTop();
  const h = d.hasil, tryout = h.mode === 'tryout';
  const box = (k) => {
    const mk = d.maks[k] || 0, pg = d.pg[k], v = h[k], ok = v >= pg;
    return `<div class="sc"><div class="mut sm">${k}${tryout ? ', passing grade ' + pg : ''}</div><div class="n" style="color:${tryout ? (ok ? 'var(--green)' : 'var(--red)') : 'var(--ink)'}">${v}<small> / ${mk}</small></div>
    <div class="bar"><i class="${tryout ? (ok ? 'ok' : 'bad') : ''}" style="width:${mk ? Math.round(v / mk * 100) : 0}%"></i>${tryout && mk ? `<u style="left:${Math.round(pg / mk * 100)}%" title="Passing grade"></u>` : ''}</div>

  };

  $('#app').innerHTML = `<div class="page-h"><div><h1>${tryout ? 'Hasil tryout ' + paketName(h.paket) : 'Hasil latihan ' + esc(h.kategori)}</h1><p>${esc(h.nama)} · ${esc(h.waktu.slice(0, 16))} · durasi ${fmtDur(h.durasi_detik)}</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" onclick="go('${S.user.role === 'admin' ? 'adminHasil' : 'home'}')">${fromHistory ? 'Kembali' : 'Ke beranda'}</button>${tryout ? '<button class="btn pri" onclick="go(\'ranking\')">Lihat peringkat</button>' : '<button class="btn pri" onclick="go(\'latihan\')">Latihan lagi</button>'}</div></div>
  <div class="verdict ${tryout ? (h.lulus === 'LULUS' ? 'ok' : 'bad') : ''}"><div><div class="mut sm">${tryout ? 'Status passing grade' : 'Skor latihan'}</div>
    <div style="font-size:22px;font-weight:600">${tryout ? (h.lulus === 'LULUS' ? 'Lulus passing grade' : 'Belum lulus passing grade') : h.benar + ' benar dari ' + (h.benar + h.salah + h.kosong) + ' soal'}</div></div>
    <div style="text-align:right"><div class="mut sm">Skor total</div><div class="big">${h.total}<small class="mut" style="font-size:16px;font-weight:400"> / ${Object.values(d.maks).reduce((a, b) => a + b, 0)}</small></div></div></div>
  <div class="sc3">${cats.map(box).join('')}</div>
  <div class="facts"><div><div class="v">${h.benar}</div><div class="l">Benar (TWK dan TIU)</div></div><div><div class="v">${h.salah}</div><div class="l">Salah (TWK dan TIU)</div></div><div><div class="v">${h.kosong}</div><div class="l">Tidak dijawab</div></div><div><div class="v">${fmtDur(h.durasi_detik)}</div><div class="l">Waktu pengerjaan</div></div></div>
  <div class="panel"><h2>Pembahasan soal</h2><div class="filters" id="rvf"></div><div id="rvl"></div></div>`;
  drawReview();
}
function drawReview() {
  const { d, f } = RV;
  const fl = [['semua', 'Semua'], ['benar', 'Skor penuh'], ['salah', 'Belum penuh'], ['kosong', 'Kosong'], ['TWK', 'TWK'], ['TIU', 'TIU'], ['TKP', 'TKP']];
  $('#rvf').innerHTML = fl.map((x) => `<button class="${f === x[0] ? 'on' : ''}" onclick="RV.f='${x[0]}';drawReview()">${x[1]}</button>`).join('') + '<button onclick="document.querySelectorAll(\'#rvl details\').forEach(e=>e.open=!e.open)" style="margin-left:auto">Buka atau tutup semua</button>';
  const list = d.soal.filter((s) => f === 'semua' || (['benar', 'salah', 'kosong'].includes(f) ? statusOf(s) === f : s.kategori === f));
  $('#rvl').innerHTML = list.map((s) => {
    const st = statusOf(s), tkp = s.kategori === 'TKP';
    const mk = st === 'kosong' ? ['kosong', '-'] : st === 'benar' ? ['ok', '&#10003;'] : tkp ? ['mid', String(s.skor)] : ['no', '&#10005;'];
    const opts = Object.keys(s.opsi).map((k) => {
      let cls = 'opt'; if (k === s.kunci) cls += ' right'; else if (k === s.jawab) cls += tkp ? ' sel' : ' wrong';
      return `<div class="${cls}"><span class="ltr">${k}</span><span>${lines(s.opsi[k])}</span>${tkp && s.skorOpsi ? `<span class="sk">skor ${s.skorOpsi[k]}</span>` : ''}</div>`;
    }).join('');
    return `<details class="rv"><summary><span class="mk ${mk[0]}">${mk[1]}</span><span class="tag">${s.kategori || '-'}</span><span class="tt">${s.no}. ${esc(s.pertanyaan)}</span></summary>
      <div class="bd"><p>${lines(s.pertanyaan)}</p>${opts}<div class="fb ${st === 'benar' ? 'ok' : st === 'kosong' ? '' : 'no'}"><b>Jawaban Anda: ${s.jawab || 'kosong'}. ${tkp ? 'Skor ' + s.skor + ' dari 5. Paling tepat: ' + s.kunci + '.' : 'Kunci: ' + s.kunci + '.'}</b>${s.pembahasan ? '<br>' + lines(s.pembahasan) : ''}</div></div></details>`;
  }).join('') || '<div class="empty">Tidak ada soal pada filter ini.</div>';
}

  const d = { id, paket: $('#f_paket').value, kategori: $('#f_kat').value, topik: $('#f_topik').value, pertanyaan: $('#f_q').value, pembahasan: $('#f_p').value };
  const kr = document.querySelector('#dlg input[name=kunci]:checked'); d.kunci = kr ? kr.value : '';
  ['A', 'B', 'C', 'D', 'E'].forEach((k) => { d[k] = $('#f_' + k).value; d['skor' + k] = $('#f_s' + k).value; });
  await api('simpanSoal', d); dlgClose(); toast('Soal disimpan'); await loadSoal();
});
window.hapusSoal = run(async (id) => { if (!confirm('Hapus soal ini? Riwayat hasil lama tetap tersimpan.')) return; await api('hapusSoal', { id }); toast('Soal dihapus'); await loadSoal(); });
window.formImport = () => dlg(`<h2>Impor soal massal</h2>
  <p class="mut sm">Salin baris dari Google Sheets lalu tempel di bawah. Urutan kolom (judul kolom boleh disertakan):</p>
  <p class="sm"><code>paket, kategori, topik, pertanyaan, A, B, C, D, E, kunci, skorA, skorB, skorC, skorD, skorE, pembahasan</code></p>
  <p class="mut sm">TWK dan TIU mengisi kolom kunci. TKP mengisi skor 1 sampai 5 tiap opsi dan mengosongkan kunci. Nomor urut dibuat otomatis.</p>
  <textarea id="imp" style="min-height:200px" placeholder="Tempel di sini"></textarea>
  <div class="dlg-act"><button class="btn sec" onclick="dlgClose()">Batal</button><button class="btn pri" onclick="doImport()">Impor</button></div>`);
window.doImport = run(async () => {
  const keys = ['paket', 'kategori', 'topik', 'pertanyaan', 'A', 'B', 'C', 'D', 'E', 'kunci', 'skorA', 'skorB', 'skorC', 'skorD', 'skorE', 'pembahasan'];
  const items = $('#imp').value.split(/\r?\n/).filter((l) => l.trim()).map((l) => l.split('\t')).filter((c) => c[0].trim().toLowerCase() !== 'paket')
    .map((c) => { const o = {}; keys.forEach((k, i) => { o[k] = (c[i] || '').trim(); }); return o; });
  if (!items.length) return toast('Tidak ada baris untuk diimpor', true);
  const r = await api('importSoal', { items });
  dlgClose(); toast(r.berhasil + ' soal diimpor' + (r.errors.length ? ', ' + r.errors.length + ' gagal' : ''), r.errors.length > 0);
  if (r.errors.length) alert('Baris yang gagal:\n' + r.errors.slice(0, 15).join('\n'));
  await loadSoal();
});

views.adminUser = async () => {
  loading();
  const L = await api('listUser'); window.USERS = L;
  $('#app').innerHTML = `<div class="page-h"><div><h1>Pengguna</h1><p>Kelola akun admin dan peserta.</p></div><button class="btn" onclick="formUser()">Tambah pengguna</button></div>
  <div class="panel tw" style="padding:0"><table><tr><th>Username</th><th>Nama</th><th>Peran</th><th>Dibuat</th><th></th></tr>
  ${L.map((u) => `<tr><td>${esc(u.username)}</td><td>${esc(u.nama)}</td><td><span class="tag ${u.role === 'admin' ? 'warn' : ''}">${esc(u.role)}</span></td><td class="nowrap">${esc(u.dibuat.slice(0, 16))}</td>
  <td class="nowrap"><button class="btn xs sec" onclick="formUser('${esc(u.username)}')">Ubah</button> <button class="btn xs red" onclick="hapusUser('${esc(u.username)}')">Hapus</button></td></tr>`).join('')}</table></div>`;
};
window.formUser = (un) => {
  const u = (window.USERS || []).find((x) => x.username === un) || { role: 'member' };
  dlg(`<h2>${un ? 'Ubah pengguna' : 'Tambah pengguna'}</h2>
  <label for="u_u">Username</label><input id="u_u" value="${esc(u.username || '')}" ${un ? 'disabled' : ''}>
  <label for="u_n">Nama</label><input id="u_n" value="${esc(u.nama || '')}">
  <label for="u_r">Peran</label><select id="u_r"><option value="member" ${u.role === 'member' ? 'selected' : ''}>member</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option></select>
  <label for="u_p">${un ? 'Password baru (kosongkan jika tidak diubah)' : 'Password (minimal 6 karakter)'}</label><input id="u_p" type="password" autocomplete="new-password">
  <div class="dlg-act"><button class="btn sec" onclick="dlgClose()">Batal</button><button class="btn pri" onclick="simpanUser(${un ? 'false' : 'true'})">Simpan pengguna</button></div>`);
};
window.simpanUser = run(async (baru) => {
  await api('simpanUser', { baru, username: $('#u_u').value.trim(), nama: $('#u_n').value.trim(), role: $('#u_r').value, password: $('#u_p').value });
  dlgClose(); toast('Pengguna disimpan'); views.adminUser();
});
window.hapusUser = run(async (un) => { if (!confirm('Hapus pengguna ' + un + '?')) return; await api('hapusUser', { username: un }); toast('Pengguna dihapus'); views.adminUser(); });

let HF = { paket: '', mode: '' };
views.adminHasil = async () => {
  loading();
  const L = await api('listHasil', HF);
  $('#app').innerHTML = `<div class="page-h"><div><h1>Hasil tes</h1><p>Riwayat tryout dan latihan semua peserta (500 terbaru).</p></div><button class="btn" onclick="rebuild()">Perbarui sheet Ranking</button></div>
  <div class="panel"><div class="row"><div><label for="hp">Set soal</label><select id="hp" onchange="hFilter()"><option value="">Semua</option>${[0, 1, 2, 3, 4, 5].map((p) => `<option value="${p}">${paketName(p)}</option>`).join('')}</select></div>
  <div><label for="hm">Jenis</label><select id="hm" onchange="hFilter()"><option value="">Semua</option><option value="tryout">Tryout</option><option value="latihan">Latihan</option></select></div></div></div>
  <div class="panel tw" style="padding:0"><table><tr><th>Waktu</th><th>Peserta</th><th>Jenis</th><th class="num">TWK</th><th class="num">TIU</th><th class="num">TKP</th><th class="num">Total</th><th>Durasi</th><th>Status</th><th></th></tr>
  ${L.map((r) => `<tr><td class="nowrap">${esc(r.waktu.slice(0, 16))}</td><td>${esc(r.nama)}<br><span class="mut sm">${esc(r.username)}</span></td><td>${jenis(r)}</td><td class="num">${r.TWK}</td><td class="num">${r.TIU}</td><td class="num">${r.TKP}</td><td class="num"><b>${r.total}</b></td><td class="nowrap">${fmtDur(r.durasi_detik)}</td><td>${statusTag(r.lulus)}</td>
  <td class="nowrap"><button class="btn xs sec" onclick="lihatDetail('${esc(r.id)}')">Detail</button> <button class="btn xs red" onclick="hapusHasil('${esc(r.id)}')">Hapus</button></td></tr>`).join('') || '<tr><td colspan="10" class="empty">Belum ada data.</td></tr>'}</table></div>`;
  $('#hp').value = HF.paket; $('#hm').value = HF.mode;
};
window.hFilter = () => { HF.paket = $('#hp').value; HF.mode = $('#hm').value; run(views.adminHasil)(); };
window.rebuild = run(async () => { const n = await api('rebuild'); toast('Sheet Ranking diperbarui (' + n + ' baris)'); });
window.hapusHasil = run(async (id) => { if (!confirm('Hapus hasil ini? Peringkat akan dihitung ulang.')) return; await api('hapusHasil', { id }); toast('Hasil dihapus'); views.adminHasil(); });

views.adminSetting = async () => {
  loading();
  const c = await api('config');
  const aktif = c.paket_aktif.split(',').map(Number);
  const f = (k, l) => `<div><label for="c_${k}">${l}</label><input id="c_${k}" type="number" min="0" value="${c[k]}"></div>`;
  $('#app').innerHTML = `<div class="page-h"><div><h1>Pengaturan</h1><p>Sesuaikan durasi, jumlah soal, dan passing grade dengan ketentuan seleksi terbaru.</p></div></div>
  <div class="panel"><h2>Ujian</h2><div class="row">${f('durasi_menit', 'Durasi tryout (menit)')}${f('jumlah_twk', 'Jumlah soal TWK')}${f('jumlah_tiu', 'Jumlah soal TIU')}${f('jumlah_tkp', 'Jumlah soal TKP')}</div></div>
  <div class="panel"><h2>Passing grade</h2><div class="row">${f('pg_twk', 'TWK')}${f('pg_tiu', 'TIU')}${f('pg_tkp', 'TKP')}</div></div>
  <div class="panel"><h2>Akses</h2><label>Paket tryout yang tampil untuk peserta</label><div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px">${[1, 2, 3, 4, 5, 6, 7, 8].map((p) => `<label style="display:flex;gap:6px;align-items:center;font-weight:400;margin:0"><input type="checkbox" class="pa" value="${p}" ${aktif.includes(p) ? 'checked' : ''}>Paket ${p}</label>`).join('')}</div>
  <label for="c_reg">Pendaftaran peserta baru</label><select id="c_reg" style="max-width:260px"><option value="true" ${c.registrasi_terbuka ? 'selected' : ''}>Dibuka</option><option value="false" ${!c.registrasi_terbuka ? 'selected' : ''}>Ditutup</option></select></div>
  <button class="btn pri" onclick="saveCfg()">Simpan pengaturan</button>`;
};
window.saveCfg = run(async () => {
  const d = {};
  ['durasi_menit', 'jumlah_twk', 'jumlah_tiu', 'jumlah_tkp', 'pg_twk', 'pg_tiu', 'pg_tkp'].forEach((k) => { d[k] = $('#c_' + k).value; });
  d.registrasi_terbuka = $('#c_reg').value;
  d.paket_aktif = [...document.querySelectorAll('.pa:checked')].map((e) => e.value).join(',');
  await api('setConfig', d); toast('Pengaturan disimpan');
});

/* ========= MULAI ========= */
(async function init() {
  drawTop();
  if (!(S.token && S.user && API)) return vAuth();
  loading();
  try { await afterLogin(); } catch (e) { logout(true); }
})();
</script>
